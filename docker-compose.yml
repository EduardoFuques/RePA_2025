version: "3"

services:
  db:
    image: postgres
    #restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  adminer:
    image: adminer
    #restart: always
    ports:
      - 8081:8080

  backend:
    build: ./backend
    volumes:
      - type: bind
        source: ./backend/src
        target: /code/src
      - ~/.local/share/zed/languages/pylsp/pylsp-venv:/opt/pylsp # Montar entorno virtual
    environment:
      PYTHONPATH: "/opt/pylsp/lib/python3.9/site-packages" # Ajustar según versión
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

