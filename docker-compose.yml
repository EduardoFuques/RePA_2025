services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Puerto NO expuesto externamente - solo accesible dentro de la red Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - repa-network

  backend:
    build: ./backend
    image: repa-backend:${BACKEND_VERSION:-latest}
    restart: unless-stopped
    # --reload solo para desarrollo local (el Dockerfile base NO incluye --reload)
    command: ["src.main:app", "--reload", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - type: bind
        source: ./backend/src
        target: /code/src
      - type: volume
        source: repa-uploads
        target: /app/uploads
    environment:
      TZ: America/Argentina/Buenos_Aires
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_ROOT_PATH: ${API_ROOT_PATH:-/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-responder@iaavim.gob.ar}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    # Puerto NO expuesto externamente - solo accesible dentro de la red Docker
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/live"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - repa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Solo desarrollo: habilita el panel de quick-login con usuarios seed.
        VITE_SHOW_TEST_USERS: "true"
        # Datos de contacto/redes de la landing — vienen del .env raíz (o fallbacks).
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-}
        VITE_CONTACT_WHATSAPP: ${VITE_CONTACT_WHATSAPP:-}
        VITE_CONTACT_WHATSAPP_LABEL: ${VITE_CONTACT_WHATSAPP_LABEL:-}
        VITE_SOCIAL_INSTAGRAM: ${VITE_SOCIAL_INSTAGRAM:-}
        VITE_SOCIAL_FACEBOOK: ${VITE_SOCIAL_FACEBOOK:-}
        VITE_CONTACT_SEDE: ${VITE_CONTACT_SEDE:-}
        VITE_CONTACT_PORTAL: ${VITE_CONTACT_PORTAL:-}
        VITE_CONTACT_PORTAL_URL: ${VITE_CONTACT_PORTAL_URL:-}
    image: repa-frontend:${FRONTEND_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      - backend
    networks:
      - repa-network

networks:
  repa-network:
    driver: bridge

volumes:
  repa-uploads:
    driver: local
