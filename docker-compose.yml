services:
  db:
    image: postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Puerto NO expuesto externamente - solo accesible dentro de la red Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - repa-network

  backend:
    build: ./backend
    image: repa-backend:${BACKEND_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./backend/src
        target: /code/src
      - type: volume
        source: repa-uploads
        target: /app/uploads
    environment:
      TZ: America/Argentina/Buenos_Aires
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_ROOT_PATH: ${API_ROOT_PATH:-/api}
    # Puerto NO expuesto externamente - solo accesible dentro de la red Docker
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - repa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: repa-frontend:${FRONTEND_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      - backend
    networks:
      - repa-network

networks:
  repa-network:
    driver: bridge

volumes:
  repa-uploads:
    driver: local
