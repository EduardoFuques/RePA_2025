# =============================================================================
# RePA 2025 — Compose de PRODUCCIÓN
# =============================================================================
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias deliberadas contra docker-compose.yml (desarrollo):
#   - ENVIRONMENT=production hardcodeado (no heredable de un .env incompleto).
#   - Backend sin --reload y sin bind mount del código fuente.
#   - Frontend sin usuarios de prueba: la imagen ya no los trae (los entrega
#     el backend en /users/demo-accounts, que en produccion responde 404).
#   - SECRET_KEY y DATABASE_URL sin default: el deploy falla si faltan.
#   - FRONTEND_URL obligatorio (arma los links de los emails de verificación
#     de cuenta y recuperación de contraseña). SMTP_* son opcionales a nivel
#     de arranque, pero sin SMTP_HOST configurado el sistema NO envía esos
#     emails — ver advertencia en los logs del backend al iniciar.
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio en producción}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio en producción}
      PGDATA: /var/lib/postgresql/data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Puerto NO expuesto externamente - solo accesible dentro de la red Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - repa-network

  backend:
    build: ./backend
    # La imagen del backend la resuelve deploy.sh: si BACKEND_REGISTRY_IMAGE
    # esta definida, apunta a GHCR (imagen ya construida por el CI); si no,
    # al tag local de siempre. El default de abajo es el que aplica cuando
    # se levanta compose a mano, sin deploy.sh.
    image: ${BACKEND_IMAGE:-repa-backend:latest}
    restart: unless-stopped
    # Sin --reload ni bind mount: corre el código copiado en la imagen.
    volumes:
      - type: volume
        source: repa-uploads
        target: /app/uploads
      - type: volume
        source: repa-logs
        target: /code/logs
    environment:
      TZ: America/Argentina/Buenos_Aires
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria en producción}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria en producción}
      ALGORITHM: ${ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS es obligatorio en producción (dominios reales, sin localhost)}
      ENVIRONMENT: production
      # En produccion los tres van cerrados salvo decision explicita.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      LOGS_PATH: /code/logs
      API_ROOT_PATH: ${API_ROOT_PATH:-/api}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es obligatorio en producción (para los links de confirmación/recuperación por email)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-responder@iaavim.gob.ar}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    # Puerto NO expuesto externamente - solo accesible dentro de la red Docker
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/live"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - repa-network

  frontend:
    # Misma imagen que QA (ver docker-compose.yml): la config por entorno va
    # en `environment`, no en build args. Sin usuarios de prueba: el backend
    # de produccion responde 404 en /users/demo-accounts.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # La define deploy.sh: la imagen publicada del frontend
    # (FRONTEND_REGISTRY_IMAGE) o, sin ella, la que construye desde ./frontend
    # — un clon suelto de Repa2025-Frontend, ya no un submodulo.
    image: ${FRONTEND_IMAGE:-repa-frontend:local}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      TZ: America/Argentina/Buenos_Aires
      VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
      VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-}
      VITE_CONTACT_WHATSAPP: ${VITE_CONTACT_WHATSAPP:-}
      VITE_CONTACT_WHATSAPP_LABEL: ${VITE_CONTACT_WHATSAPP_LABEL:-}
      VITE_SOCIAL_INSTAGRAM: ${VITE_SOCIAL_INSTAGRAM:-}
      VITE_SOCIAL_FACEBOOK: ${VITE_SOCIAL_FACEBOOK:-}
      VITE_CONTACT_SEDE: ${VITE_CONTACT_SEDE:-}
      VITE_CONTACT_PORTAL: ${VITE_CONTACT_PORTAL:-}
      VITE_CONTACT_PORTAL_URL: ${VITE_CONTACT_PORTAL_URL:-}
    depends_on:
      - backend
    networks:
      - repa-network

networks:
  repa-network:
    driver: bridge

volumes:
  repa-uploads:
    driver: local
  repa-logs:
    driver: local
