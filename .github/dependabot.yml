# Dependabot — actualizaciones de version.
#
# QUE CUBRE CADA ECOSISTEMA ACA:
#
#   docker          la imagen base del backend (backend/Dockerfile). El tag
#                   `3.14-slim` ya trae los parches de la 3.14 en cada build,
#                   pero un MAYOR nuevo (3.15, 3.16...) no llega solo: eso es
#                   lo que abre Dependabot como PR, para que alguien lo mire
#                   antes de que entre.
#
#   docker-compose  las imagenes que se declaran en los compose de la raiz,
#                   que el ecosistema `docker` NO mira porque solo lee
#                   Dockerfiles. Hoy eso es postgres:17-alpine, que hasta
#                   ahora no vigilaba nadie: la base de datos era la unica
#                   pieza del stack sin quien le avisara de una version nueva.
#
#   github-actions  las acciones pineadas en los workflows (checkout,
#                   build-push-action, trivy-action...). Sin esto quedan
#                   congeladas en la version del dia que se escribieron.
#
#   pip             backend/requirements.txt y requirements-dev.txt.
#                   Complementa a pip-audit de
#                   ci.yml: pip-audit AVISA que hay un CVE, Dependabot abre
#                   el PR que lo sube.
#
# POR QUE SI SE HABILITA pip ACA (a diferencia de turno-app, donde npm quedo
# afuera): los tests de RePA corren contra un postgres efimero levantado como
# `service` del propio job — cada PR de Dependabot tiene su base aislada y no
# se pisan entre si. En turno-app los tests de integracion pegan contra la
# base compartida de staging, y por eso tres PRs en paralelo se veian los
# datos entre si; aca ese problema no existe.
#
# POR QUE NO ESTA npm: el frontend vive en otro repositorio
# (Repa2025-Frontend, incluido aca como submodulo). Dependabot solo mira el
# repo donde esta este archivo — no entra a los submodulos. Las dependencias
# de npm del frontend hay que cubrirlas con un dependabot.yml en ESE repo.
version: 2
updates:
  - package-ecosystem: docker
    # Los Dockerfile no estan en la raiz: backend/ tiene el suyo y el
    # frontend es un submodulo. `directories` (plural) permite listar varios.
    directories:
      - "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    labels:
      - dependencias

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    labels:
      - dependencias

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - dependencias
    ignore:
      # bcrypt 5.x no se puede usar mientras dependamos de passlib.
      #
      # passlib 1.7.4 es de octubre de 2020 y esta sin mantenimiento. Rompe
      # con bcrypt 5.x por dos motivos independientes, los dos verificados en
      # el CI del PR #38 (260 errores, 40 tests pasando):
      #
      #   1. AttributeError: module 'bcrypt' has no attribute '__about__'
      #      passlib lee bcrypt.__about__.__version__ para detectar la version
      #      del backend. bcrypt lo saco en la 4.1; en la 5.x ya no existe.
      #
      #   2. ValueError: password cannot be longer than 72 bytes
      #      passlib prueba a proposito con una clave de mas de 72 bytes para
      #      detectar un bug viejo de bcrypt. La 4.x truncaba en silencio, la
      #      5.x tira excepcion — asi que la rutina de deteccion de passlib se
      #      mata sola.
      #
      # ESTO NO SE ARREGLA ACTUALIZANDO BCRYPT, se arregla sacando passlib.
      # La superficie es chica: src/utils.py, src/seed.py y
      # src/routes/user_routes.py, siempre el mismo CryptContext con hash() y
      # verify(), reemplazable por bcrypt.hashpw/checkpw directo. Las claves
      # ya guardadas siguen validando: es el mismo algoritmo y el mismo
      # formato `$2b$`, no hay que rehashear a nadie.
      #
      # El ignore es para que Dependabot deje de proponer lo mismo en cada
      # release de bcrypt. Cerrarlo a mano no alcanza: vuelve a abrirlo y en
      # tres meses nadie se acuerda de por que se habia descartado. Cuando se
      # saque passlib, HAY QUE BORRAR ESTAS LINEAS — si no, bcrypt se queda
      # congelado en la 4.x para siempre, sin que nadie se entere.
      #
      # Mientras tanto la 4.x sigue recibiendo parches por Dependabot: lo
      # unico ignorado son los saltos de version MAYOR.
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    labels:
      - dependencias
