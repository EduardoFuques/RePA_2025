name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest -v --tb=short

  migrations:
    name: Validar migraciones Alembic
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Aplicar migraciones (upgrade head)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_db
          SECRET_KEY: test-secret-key-for-ci
        run: alembic upgrade head

      - name: Verificar que el esquema coincide con los modelos (sin drift)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_db
          SECRET_KEY: test-secret-key-for-ci
        run: alembic check

      - name: Verificar reversibilidad (downgrade base + upgrade head)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_db
          SECRET_KEY: test-secret-key-for-ci
        run: |
          alembic downgrade base
          alembic upgrade head

  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar ruff
        run: pip install ruff

      - name: Ejecutar linter
        working-directory: ./backend
        run: ruff check src/ --ignore E501

  seguridad:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar pip-audit
        run: pip install pip-audit

      # Se auditan los dos archivos por separado, y no juntos, para que el
      # reporte distinga que CVE viaja en la imagen que atiende usuarios de
      # cual se queda en la maquina de desarrollo o en el runner. No es lo
      # mismo y tratarlos igual hace que se ignoren los dos.
      - name: Buscar CVEs en las dependencias de runtime (van en la imagen)
        working-directory: ./backend
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc

      - name: Buscar CVEs en las dependencias de desarrollo
        working-directory: ./backend
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --desc

  # Verifica que la imagen del backend COMPILA, sin publicarla. El build
  # real (el que se publica y se despliega) lo hace docker-publish.yml
  # cuando sale un tag de version.
  #
  # POR QUE SIGUE EXISTIENDO ESTE JOB. Antes este repo construia la imagen
  # aca y la tiraba, y despues el servidor la volvia a construir en el
  # deploy: el costo se pagaba dos veces. Eso ya no pasa — pero si un merge
  # a main es solo `chore:`, semantic-release no crea version y
  # docker-publish.yml nunca corre: sin este job, un Dockerfile roto por un
  # commit de ese tipo no se detectaria hasta el siguiente release. Con el
  # cache de Actions compartido con docker-publish.yml, ademas, este build
  # calienta las capas que despues usa la publicacion.
  build-check:
    name: Verificar build de la imagen
    runs-on: ubuntu-latest
    needs: [test, migrations, lint]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build del backend (sin push)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dispara release.yml explicitamente (no `workflow_run`: ese trigger se
  # resuelve contra la copia del workflow en la rama default del repo, no
  # contra la rama que aca corrio CI). Solo en push a main — en un
  # pull_request no corresponde taggear nada.
  #
  # semantic-release decide si hay version nueva mirando los commits; si no
  # la hay, no pasa nada mas abajo en la cadena. Nada se publica ni se
  # despliega sin haber pasado por aca, que es el punto: el tag es la prueba
  # de que el CI paso.
  release:
    name: Disparar release
    runs-on: ubuntu-latest
    needs: [test, migrations, lint, build-check]
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      # GH_REPO es obligatorio, no decorativo: este job no hace checkout (no
      # necesita el codigo, solo dispara), y sin repositorio git en el disco
      # `gh` no tiene contra que repo actuar. Falla con "fatal: not a git
      # repository", que parece un problema del runner y no lo es.
      - name: Disparar release.yml
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main -f ref="${{ github.sha }}"
