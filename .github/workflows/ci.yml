name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest -v --tb=short

  migrations:
    name: Validar migraciones Alembic
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migraciones (upgrade head)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_db
          SECRET_KEY: test-secret-key-for-ci
        run: alembic upgrade head

      - name: Verificar que el esquema coincide con los modelos (sin drift)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_db
          SECRET_KEY: test-secret-key-for-ci
        run: alembic check

      - name: Verificar reversibilidad (downgrade base + upgrade head)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations_db
          SECRET_KEY: test-secret-key-for-ci
        run: |
          alembic downgrade base
          alembic upgrade head

  lint:
    name: Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar ruff
        run: pip install ruff

      - name: Ejecutar linter
        working-directory: ./backend
        run: ruff check src/ --ignore E501

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, migrations, lint]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build backend image
        working-directory: ./backend
        run: docker build -t repa-backend:${{ github.sha }} .

      - name: Verificar imagen
        run: docker images repa-backend

  deploy:
    name: Deploy a QA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: qa
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT }}
          script: |
            set -e  # Fallar si algún comando falla
            cd ~/RePA_2025
            git pull origin main
            
            # Ejecutar deploy
            ./deploy.sh
            
            # Esperar a que los contenedores estén healthy (máx 60s)
            echo "⏳ Verificando health de contenedores..."
            for i in {1..12}; do
              if curl -sf http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ Backend healthy"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ Backend no responde después de 60s"
                docker compose logs backend --tail=50
                exit 1
              fi
              echo "Esperando backend... ($i/12)"
              sleep 5
            done
            
            echo "✅ Deploy completado - Commit: ${{ github.sha }}"
